<svg xmlns="http://www.w3.org/2000/svg" width="640" height="160" viewBox="0 0 640 160" role="img" aria-labelledby="t">
  <title id="t">Tool Dictionary</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b7cfa"/>
      <stop offset="1" stop-color="#22c1c3"/>
    </linearGradient>
  </defs>
  <!-- book: a dictionary, open -->
  <g transform="translate(24 28)">
    <rect x="0" y="0" width="104" height="104" rx="22" fill="url(#g)"/>
    <path d="M26 30 h24 a6 6 0 0 1 6 6 v44 a6 6 0 0 0 -6 -6 h-24 z" fill="#fff" opacity="0.95"/>
    <path d="M78 30 h-24 a6 6 0 0 0 -6 6 v44 a6 6 0 0 1 6 -6 h24 z" fill="#fff" opacity="0.75"/>
    <!-- magnifier: the search -->
    <circle cx="70" cy="70" r="13" fill="none" stroke="#0f172a" stroke-width="6"/>
    <path d="M80 80 l14 14" stroke="#0f172a" stroke-width="7" stroke-linecap="round"/>
  </g>
  <text x="152" y="82" font-family="ui-sans-serif, -apple-system, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#0f172a">Tool Dictionary</text>
  <text x="154" y="118" font-family="ui-sans-serif, -apple-system, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="19" fill="#475569">Thousands of tools. The agent sees three.</text>
</svg>
